---
# Tag-only stage: no deployment, just pushes a git tag named v<image-tag>.
# Downstream of all three prods; the first prod to accept the Freight unlocks
# eligibility, and Kargo's per-Stage promotion idempotency guarantees the tag
# is pushed exactly once even if you click Promote from multiple prods.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release
  namespace: kargo-helm
  annotations:
    kargo.akuity.io/color: purple
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      stages:
        - prod
        - prod-italy
        - prod-australia
  promotionTemplate:
    spec:
      steps:
      - task:
          name: tag-release
