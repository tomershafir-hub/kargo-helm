apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: kargo-helm
spec:
  vars:
  - name: image
    value: nginx
  - name: repoURL
    value: https://github.com/tomershafir-hub/kargo-helm.git
  - name: branch
    value: main

  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: ${{ vars.branch }}
        path: ./out
  - if: ${{ ctx.targetFreight.origin.name == "guestbook" }}
    uses: yaml-update
    as: update-image
    config:
      path: ./out/env/${{ ctx.stage }}/values.yaml
      updates:
      - key: image.tag
        value: ${{ imageFrom( vars.image, warehouse("guestbook") ).Tag }}
  - if: ${{ ctx.targetFreight.origin.name == "features" }}
    uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - commit: ${{ commitFrom( vars.repoURL, warehouse("features") ).ID }}
        path: ./features
  - if: ${{ ctx.targetFreight.origin.name == "features" }}
    uses: copy
    config:
      inPath: ./features/base/feature-flags.yaml
      outPath: ./out/env/${{ ctx.stage }}/feature-flags.yaml
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: >-
        ${{
        ctx.targetFreight.origin.name == 'guestbook' ?
        'updated '+ctx.stage+' guestbook to '+imageFrom( vars.image, warehouse("guestbook") ).Tag :
        'updates '+ctx.stage+' features.yaml from '+commitFrom( vars.repoURL, warehouse("features") ).ID
        }}
  - uses: git-push
    config:
      path: ./out
  - uses: argocd-update
    config:
      apps:
      - name: kargo-helm-${{ ctx.stage }}

---
# Tags the repo with v<image-tag> when a Freight reaches the `release` stage.
# `release` is downstream of all three prods. Kargo only promotes a given
# Freight to a given Stage once, so the tag is pushed exactly once even if
# the Freight is already deployed to multiple prods.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: tag-release
  namespace: kargo-helm
spec:
  vars:
  - name: image
    value: nginx
  - name: repoURL
    value: https://github.com/tomershafir-hub/kargo-helm.git
  - name: branch
    value: main
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: ${{ vars.branch }}
        path: ./out
  - uses: git-push
    config:
      path: ./out
      tag: v${{ imageFrom( vars.image, warehouse("guestbook") ).Tag }}
